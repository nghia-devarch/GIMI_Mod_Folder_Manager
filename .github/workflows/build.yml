name: Build and Release EXE

on:
  push:
    branches: [ "main" ] # Đổi thành "master" nếu nhánh chính của bạn là master
  workflow_dispatch: # Cho phép bấm nút tự chạy thủ công

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --onefile --noconsole MFM.py

    - name: Create GitHub Release and Upload Asset
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        body: |
          Bản build tự động từ GitHub Actions.
          Mã commit: ${{ github.sha }}
        files: dist/MFM.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
